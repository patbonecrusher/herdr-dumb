name: herdr-dumb build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: 'true'
  # Match CI's smaller debug symbols while retaining useful failure backtraces.
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'

jobs:
  validate:
    if: github.repository == 'patbonecrusher/herdr-dumb'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version and source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/fork_release.py check-version --tag "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          else
            python3 scripts/fork_release.py check-version
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test packaging and workflow policy
        run: |
          python3 -m unittest scripts.test_fork_release scripts.test_package_windows_conpty
          bun test scripts/fork-release-workflow.test.ts

  build:
    if: github.repository == 'patbonecrusher/herdr-dumb'
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: herdr-dumb-macos-arm64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: herdr-dumb-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ASSET: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - name: Check formatting and test native target
        run: |
          cargo fmt --check
          just test-release-target "$BUILD_TARGET"
      - name: Build release binary
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: just build
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary="target/$BUILD_TARGET/release/herdr-dumb"
          expected="herdr-dumb $(python3 scripts/fork_release.py check-version)"
          test "$("$binary" --version)" = "$expected"
          python3 scripts/fork_release.py package-macos --binary "$binary" --output "dist/$BUILD_ASSET"
      - name: Package Windows and verify Microsoft signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-dumb-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe "target\$env:BUILD_TARGET\release\herdr-dumb.exe" `
            -PackagePath $package `
            -StageDir $stage `
            -ExecutableName herdr-dumb.exe `
            -OutputPath "dist\$env:BUILD_ASSET"
          $expected = "herdr-dumb $(& python scripts/fork_release.py check-version)"
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }
          $actual = (& (Join-Path $stage "herdr-dumb.exe") --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Packaged binary identity mismatch: $actual; expected $expected"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'patbonecrusher/herdr-dumb' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require repository admins for publishing and reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
            test "$permission" = admin || { echo "Publishing requires repository admin permission" >&2; exit 1; }
          done
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$tag_commit" = "$GITHUB_SHA" || { echo "Release tag moved during this build" >&2; exit 1; }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: herdr-dumb-*
          merge-multiple: true
          path: dist
      - name: Validate complete release and calculate checksums
        run: |
          python3 scripts/fork_release.py check-version --tag "$GITHUB_REF_NAME"
          python3 scripts/fork_release.py checksums --directory dist
      - name: Publish release without changing tags or existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/herdr-dumb-macos-arm64.tar.gz \
            dist/herdr-dumb-windows-x86_64.zip \
            dist/SHA256SUMS \
            --verify-tag --title "herdr-dumb $GITHUB_REF_NAME" \
            --notes "Windows x86-64 and macOS Apple Silicon binaries. Verify downloads with SHA256SUMS. Keep the Windows ConPTY directory beside herdr-dumb.exe. Application auto-updates remain disabled."
